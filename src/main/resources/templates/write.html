<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.title}">페이지 제목</title>
</head>
<body>
<h1 th:text="#{page.title}">글쓰기</h1>

<form action="/submit" method="post">
    <label for="title" th:text="#{form.title}">제목</label><br>
    <input type="text" id="title" name="title"><br><br>

    <label for="content" th:text="#{form.content}">내용</label><br>
    <textarea id="content" name="content" rows="5" cols="40"></textarea><br><br>

    <button type="submit" th:text="#{form.submit}">등록하기</button>
</form>
</body>
</html>
